# Pokémon Showdown on Cloudflare Workers + Durable Objects + D1
# See README.md for setup.

name = "pokemon-showdown"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
# The simulator uses node:path; everything else is shimmed at build time
compatibility_flags = ["nodejs_compat"]

# build.mjs bundles the simulator (wrangler's bundler can't resolve its dynamic requires)
no_bundle = true
[build]
command = "node build.mjs"
watch_dir = ["src", "../sim", "../data", "../config", "../lib"]

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[limits]
# Loading formats and validating teams is CPU-heavy on a cold start
cpu_ms = 30000

[[d1_databases]]
binding = "DB"
database_name = "pokemon-showdown"
# No database_id: `wrangler deploy` creates the database on first deploy
# (automatic provisioning). To use an existing one, add its database_id here.
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "BATTLES"
class_name = "BattleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoom"]

# Secrets (set with `wrangler secret put NAME`, or .dev.vars locally):
#   BETTER_AUTH_SECRET    random string, at least 32 characters
#   GOOGLE_CLIENT_ID      OAuth client from Google Cloud Console
#   GOOGLE_CLIENT_SECRET
# Optional vars: BETTER_AUTH_URL (public URL; inferred from requests if unset),
# TRUSTED_ORIGINS, EMAIL_PASSWORD_LOGIN ("true" for local testing only)

[observability]
enabled = true
